# PyroMinions 1.1.0 | Yapımcı: pyroBuff
# Oyuncu mesajları. & renk kodları desteklenir; YAML anahtarlarını ve yer tutucuları koruyun.
# Oyuncuya gönderilen mesajların başına eklenen yazı.
prefix: '&8[&6&lPyro&f&lMinions&8] &r'
# Menülerde ve eşyalarda kullanılan kısa metinler ve etiketler.
labels:
  level-format: '%name% %level%. Seviye'
  no-chest: Yok
  enabled: Açık
  disabled: Kapalı
  selected: '&aSeçili'
  select: '&7Seçmek için tıkla.'
  max-level: Son seviye
  feeder-level-range: '&7%level%. Seviye besleme alanı: &b%diameter%x%diameter% blok &8(%radius% blok yarıçap)'
  cancel-word: iptal
  statistics-units:
    miner: Blok
    fisher: Balık
    feeder: Besleme
# Minyon eşyasının açıklaması; %level%, %statistics%, %statistics_unit% desteklenir.
item-lore:
- '&7Seviye: &b%level%'
- '&7İstatistikler: &f%statistics% %statistics_unit%'
# Oyuncu ve yönetici yardım komutu satırları.
# Yardım renkleri: altın başlık, sarı komut, mavi zorunlu ve gri isteğe bağlı parametre.
help:
  player:
    - ''
    - '&8&m----------------------------------------'
    - '&6&lPyroMinions &8» &fOyuncu komutları'
    - '&e/pm &8— &7Minyonlarını görüntüle.'
    - '&e/pm shop &8— &7Minyon marketini aç.'
    - '&e/pm help &8— &7Komutları ve kullanımını göster.'
    - '&8Diğer adlar: &7/pminions, /pyrominion, /pyrominions'
    - '&8Alt komutlar: &7list / minions / menu &8• &7shop / market &8• &7help / about'
    - '&8&m----------------------------------------'
  admin:
    - ''
    - '&6&lPyroMinions &8» &fYönetici komutları'
    - '&e/pma get &b<tür> &7[seviye] [adet] &8— &fKendine minyon ver.'
    - '&e/pma give &b<tür> <oyuncu> &7[seviye] [adet] &8— &fÇevrimiçi oyuncuya ver.'
    - '&e/pma minions &7[oyuncu] &8— &fMinyon listesini aç.'
    - '&e/pma info &b<uuid> &8— &fMinyonun kayıt bilgilerini göster.'
    - '&e/pma remove &7[uuid] &8— &cMinyonu eşya iadesiz sil.'
    - '&e/pma reload &8— &fAyarları, mesajları ve menüleri yenile.'
    - '&e/pma stats &8— &fKayıtlı ve chunkı yüklü minyon sayılarını göster.'
    - '&8Türler: &bminer &7(madenci), &bfisher &7(balıkçı), &bfeeder &7(besleyici)'
    - '&b<...> &7zorunlu &8| &7[...] isteğe bağlı &8| &7Seviye/adet varsayılanı: &f1'
    - '&7Örnek: &e/pma give miner Oyuncu 2 3'
    - '&c! &7UUID yazmadan silmek için minyona en fazla &f5 blok &7uzaktan bak.'
    - '&8Diğer ad: &7/pyrominionsadmin &8| &7Yardım: &e/pma help'
    - '&8&m----------------------------------------'
